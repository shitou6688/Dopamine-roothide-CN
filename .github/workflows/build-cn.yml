name: Build Dopamine-roothide CN (no overseas network on device)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "index = 通用包(内置精简索引, Apple CDN 直连) | offline = 单机型完全离线包 | both = 两个都出"
        required: true
        default: both
        type: choice
        options: [both, index, offline]
      coverage:
        description: "all = 全量索引(所有支持越狱的设备/系统, 普通签名免代理) | single = 只按 device/targets_file 生成"
        required: true
        default: all
        type: choice
        options: [all, single]
      workers:
        description: "全量索引并发探测数(网络不稳可调小)"
        required: false
        default: "32"
      device:
        description: "机型标识，如 iPhone15,3 / iPad14,3。留空则读取 targets_file"
        required: false
        default: ""
      os_build:
        description: "系统 Build，如 21E236（设置-通用-关于本机）。与 device 必须同时填"
        required: false
        default: ""
      firmware_url:
        description: "可选：直接给出 IPSW 下载直链，跳过 ipsw.me 解析"
        required: false
        default: ""
      targets_file:
        description: "多行目标文件，格式 DEVICE|BUILD[|IPSW_URL]"
        required: false
        default: "Tools/targets.txt"
      upstream_branch:
        description: "上游分支（仅当本仓库不是 Dopamine fork 时用于克隆）"
        required: false
        default: "3.x"
      make_release:
        description: "是否同时发布到本仓库 Releases"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: dopamine-cn-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Dopamine-roothide 3.x does not build with Xcode 26 / iPhoneOS26 SDK:
    # Apple clang 21's linker segfaults on watchdoghook.dylib. macos-15 ships
    # Xcode 16.4 (default), which is the toolchain this branch targets.
    runs-on: macos-15
    # The full-coverage index probes thousands of IPSW central directories.
    timeout-minutes: 240
    steps:
      - name: Xcode setup
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Checkout this repository
        uses: actions/checkout@v4
        with:
          path: repo
          submodules: recursive
          fetch-depth: 1

      # Works in two layouts:
      #   (a) this repo is a fork of Dopamine-roothide + Tools/ added  -> use it directly
      #   (b) this repo only contains Tools/ + this workflow            -> clone upstream
      - name: Locate source tree
        run: |
          set -e
          if [ -f repo/Application/Dopamine.xcodeproj/project.pbxproj ]; then
            echo "WORK_DIR=$GITHUB_WORKSPACE/repo" >> "$GITHUB_ENV"
            echo "Source layout: Dopamine fork"
          else
            git clone --depth 1 --recurse-submodules --shallow-submodules \
              -b "${{ inputs.upstream_branch }}" \
              https://github.com/roothide/Dopamine-roothide.git upstream
            cp -R repo/Tools upstream/Tools
            echo "WORK_DIR=$GITHUB_WORKSPACE/upstream" >> "$GITHUB_ENV"
            echo "Source layout: upstream clone + CN tools"
          fi

      - name: Install Procursus toolchain
        uses: dhinakg/procursus-action@main
        with:
          packages: ldid findutils sed coreutils make

      - name: Install build dependencies
        run: |
          set -e
          brew install make libarchive
          echo "PATH=$(brew --prefix make)/libexec/gnubin:$PATH" >> "$GITHUB_ENV"

      - name: Install THEOS
        run: |
          set -ex
          cd "$WORK_DIR"
          export THEOS="$WORK_DIR/theos"
          # Do NOT create $THEOS/sdks here: install-theos.sh treats a non-empty
          # $THEOS as "already installed" and calls bin/update-theos, which does
          # not exist on a fresh checkout. The gsed patch below creates the
          # sdks/ placeholder after the clone instead.
          curl -fsSL https://raw.githubusercontent.com/roothide/theos/master/bin/install-theos > install-theos.sh
          gsed -E "/^\s*get_theos\s*$/,+1 s/^(\s*)(get_sdks)\s*$/\1mkdir -p \${THEOS}\/sdks\n\1touch \${THEOS}\/sdks\/sdk\n\1\2/g" -i install-theos.sh
          bash install-theos.sh
          mkdir -p "$THEOS/sdks"
          curl -fL https://github.com/theos/sdks/releases/latest/download/iPhoneOS16.5.sdk.tar.xz \
            -o "$THEOS/sdks/iPhoneOS16.5.sdk.tar.xz"
          # install-theos.sh installs xz-utils via Procursus. Decompress
          # explicitly rather than relying on gunzip (which cannot read xz) or
          # on the runner's bsdtar auto-detecting the lzma stream.
          if command -v xz >/dev/null 2>&1; then
            xz -dk "$THEOS/sdks/iPhoneOS16.5.sdk.tar.xz"
            tar -xf "$THEOS/sdks/iPhoneOS16.5.sdk.tar" -C "$THEOS/sdks"
            rm -f "$THEOS/sdks/iPhoneOS16.5.sdk.tar"
          else
            tar -xf "$THEOS/sdks/iPhoneOS16.5.sdk.tar.xz" -C "$THEOS/sdks"
          fi
          rm -f "$THEOS/sdks/iPhoneOS16.5.sdk.tar.xz"
          ls -la "$THEOS/sdks"

      - name: Build and install trustcache
        run: |
          set -ex
          git clone --depth 1 https://github.com/CRKatri/trustcache.git trustcache-build
          cd trustcache-build
          export CFLAGS="$CFLAGS -I$(brew --prefix openssl)/include -arch arm64"
          export LDFLAGS="$LDFLAGS -L$(brew --prefix openssl)/lib -arch arm64"
          gmake -j"$(sysctl -n hw.logicalcpu)" OPENSSL=1
          sudo cp trustcache /opt/procursus/bin/

      - name: Prepare build targets
        run: |
          set -e
          cd "$WORK_DIR"
          if [ "${{ inputs.coverage }}" = "all" ] && [ "${{ inputs.mode }}" = "offline" ]; then
            echo "::error::coverage=all 只产出全量通用包；请选 mode=index/both，或把 coverage 改成 single 再出离线包"
            exit 1
          fi
          mkdir -p build/cn
          if [ -n "${{ inputs.device }}" ]; then
            if [ -z "${{ inputs.os_build }}" ]; then
              echo "::error::填写 device 时必须同时填写 os_build"
              exit 1
            fi
            printf '%s|%s|%s\n' "${{ inputs.device }}" "${{ inputs.os_build }}" "${{ inputs.firmware_url }}" \
              > build/cn/targets.all
          else
            cp "${{ inputs.targets_file }}" build/cn/targets.all
          fi
          grep -vE '^\s*(#|$)' build/cn/targets.all > build/cn/targets.active || true
          if [ ! -s build/cn/targets.active ]; then
            echo "::error::没有有效目标，请填写 device+os_build 或编辑 targets_file"
            exit 1
          fi
          echo "--- targets ---"
          cat build/cn/targets.active

      - name: Apply CN kernel-source patch
        run: |
          set -ex
          cd "$WORK_DIR"
          python3 Tools/cn_kernel.py selftest
          python3 Tools/cn_kernel.py patch --repo .

      # L2: replace the upstream closed-source download libraries with the
      # hardened pair (runtime AppleDB resolve, all candidates retried,
      # BuildManifest digest, identity UA / If-Range / short-read rejection),
      # and apply the NULL-safety fixes to util.c / DOEnvironmentManager.m.
      # L1 (build-time index) stays the primary path, so a normal signature
      # never needs api.appledb.dev unless the index misses.
      - name: Apply hardened runtime-resolve layer (L2)
        run: |
          set -ex
          cd "$WORK_DIR"
          python3 Tools/apply_hardening.py --repo .
          ls -lh Application/Dopamine/Dependencies/libgrabkernel2.a \
                 Application/Dopamine/Dependencies/libpartial.a

      - name: Resolve kernel metadata (single device)
        if: inputs.coverage == 'single' && inputs.mode != 'offline'
        run: |
          set -ex
          cd "$WORK_DIR"
          python3 Tools/cn_kernel.py index \
            --out build/cn/KernelIndex.plist \
            --targets build/cn/targets.active
          ls -lh build/cn/KernelIndex.plist

      - name: Build full-coverage kernel index (all supported devices)
        if: inputs.coverage == 'all' && inputs.mode != 'offline'
        run: |
          set -ex
          cd "$WORK_DIR"
          python3 Tools/cn_kernel.py fullindex \
            --out build/cn/KernelIndex.plist \
            --workers "${{ inputs.workers }}" \
            --timeout 25
          ls -lh build/cn/KernelIndex.plist
          python3 -c "import plistlib;d=plistlib.load(open('build/cn/KernelIndex.plist','rb'));print('coverage:',d['coverage'])"

      - name: Download kernelcache for fully-offline IPA
        if: inputs.mode != 'index' && inputs.coverage != 'all'
        run: |
          set -ex
          cd "$WORK_DIR"
          : > build/cn/offline.manifest
          n=0
          while IFS= read -r line; do
            n=$((n + 1))
            printf '%s\n' "$line" > build/cn/one.target
            dev=$(printf '%s' "$line" | cut -d'|' -f1)
            bld=$(printf '%s' "$line" | cut -d'|' -f2)
            python3 Tools/cn_kernel.py fetch \
              --out "build/cn/offline/$n" \
              --targets build/cn/one.target
            printf '%s|%s|%s\n' "$dev" "$bld" "$n" >> build/cn/offline.manifest
          done < build/cn/targets.active
          find build/cn/offline -type f -exec ls -lh {} \;

      - name: Build Dopamine-roothide
        run: |
          set -ex
          cd "$WORK_DIR"
          export THEOS="$WORK_DIR/theos"
          gmake -j"$(sysctl -n hw.logicalcpu)" NIGHTLY=1
          APP_VERSION="$(cat ./BaseBin/_external/basebin/.version)-$(cat ./BaseBin/_external/basebin/.version-roothide)"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          test -d ./Application/build/Build/Products/Debug-iphoneos/Dopamine.app

      - name: Package CN IPA / TIPA
        run: |
          set -ex
          cd "$WORK_DIR"
          APP="$WORK_DIR/Application/build/Build/Products/Debug-iphoneos/Dopamine.app"
          ENT="$WORK_DIR/Application/Dopamine/Dopamine.entitlements"
          OUT="$WORK_DIR/build/cn/out"
          mkdir -p "$OUT"
          VER="CN-${{ env.APP_VERSION }}-$(git rev-parse --short HEAD)"

          if [ "${{ inputs.mode }}" != "offline" ]; then
            python3 Tools/cn_kernel.py pack \
              --app "$APP" \
              --resources build/cn/KernelIndex.plist \
              --entitlements "$ENT" \
              --out "$OUT/Dopamine-roothide-$VER.ipa"
          fi

          if [ "${{ inputs.mode }}" != "index" ] && [ "${{ inputs.coverage }}" != "all" ]; then
            # The universal bundle above left KernelIndex.plist inside the app;
            # offline IPAs must carry only the three kernel payloads.
            rm -f "$APP/KernelIndex.plist"
            while IFS='|' read -r dev bld n; do
              python3 Tools/cn_kernel.py pack \
                --app "$APP" \
                --resources "build/cn/offline/$n" \
                --entitlements "$ENT" \
                --out "$OUT/Dopamine-roothide-$VER-OFFLINE-${dev}-${bld}.ipa"
              # Keep the universal bundle clean for the next iteration.
              rm -f "$APP/kernelcache" "$APP/sptm.im4p" "$APP/txm.im4p"
            done < build/cn/offline.manifest
          fi
          echo "--- artifacts ---"
          ls -lh "$OUT"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Dopamine-roothide-CN-${{ inputs.coverage }}
          path: ${{ env.WORK_DIR }}/build/cn/out/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish release
        if: inputs.make_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: cn-hybrid-${{ env.APP_VERSION }}-${{ github.run_number }}
          name: Dopamine-roothide CN hybrid ${{ env.APP_VERSION }} (build ${{ github.run_number }})
          body: |
            合并版（L1 构建期索引 + L2 加固运行时解析）。普通签名安装、国内网络免代理。
            - L1：构建期解析全部机型/Build 的 KernelIndex.plist（schema 2），命中后设备端只向 Apple CDN 发 Range 请求，不访问 api.appledb.dev；请求带 identity / If-Range / Safari UA，短读与校验失败自动重试 3 次。
            - L2：索引未命中（例如新固件）时，用加固版 libgrabkernel2 + libpartial 在设备端动态解析：遍历全部候选链接、每个重试 3 次、按 BuildManifest 摘要校验、补齐 kernelcache/sptm.im4p/txm.im4p；此层可能访问境外 AppleDB。
            - 另含 boot_manifest_hash / activePrebootPath 空指针防护。
            - coverage=all：全量通用包；coverage=single：只覆盖 targets_file；`*-OFFLINE-*`：单机型零联网包。
          files: ${{ env.WORK_DIR }}/build/cn/out/*
